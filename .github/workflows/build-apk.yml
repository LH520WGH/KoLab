name: Build KoLab Debug APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; fi
          "$SDKMGR" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile KoLab and test client
        run: gradle --no-daemon --stacktrace :app:assembleDebug :client-test:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: KoLab-Bridge-0.2-alpha-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: KoLab-Client-Tester-APK
          path: client-test/build/outputs/apk/debug/client-test-debug.apk
          if-no-files-found: error
